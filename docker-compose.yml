services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mattermost:
    image: mattermost/mattermost-team-edition:10.11.25
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEOPENSERVER: "true"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
    ports:
      - "8065:8065"
    volumes:
      - mm_data:/mattermost/data
      - mm_config:/mattermost/config
      - mm_logs:/mattermost/logs
      - mm_plugins:/mattermost/plugins
      - mm_client_plugins:/mattermost/client/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  switch:
    build: .
    env_file:
      - .env
    environment:
      SWITCH_BRIDGE: "on"
      SWITCH_PORT: "8090"
      MATTERMOST_URL: http://mattermost:8065
      DATABASE_URL: sqlite:////var/lib/seaswarm/seaswarm.db
      TOKEN_STORE: /var/lib/seaswarm/mm_tokens.json
      DATA_DIR: /data
      ROOM_TEMPLATE: /app/room_templates/sar_room.yaml
      EXPORT_DIR: /var/lib/seaswarm/exports
    ports:
      - "8090:8090"
    volumes:
      - ./.runtime:/var/lib/seaswarm
      - ./data:/data:ro
      - ./room_templates:/app/room_templates:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      mattermost:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  context-agent:
    build: .
    command: ["uvicorn", "agents.context_agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      ROOM_ID: sar-harnai
      AGENT_NAME: context
      DATABASE_URL: sqlite:////var/lib/seaswarm/seaswarm.db
      DATA_DIR: /data
      ROOM_TEMPLATE: /app/room_templates/sar_room.yaml
      EXPORT_DIR: /var/lib/seaswarm/exports
    volumes:
      - ./.runtime:/var/lib/seaswarm
      - ./data:/data:ro
      - ./room_templates:/app/room_templates:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      switch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  options-agent:
    build: .
    command: ["uvicorn", "agents.options_agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      ROOM_ID: sar-harnai
      AGENT_NAME: options
      DATABASE_URL: sqlite:////var/lib/seaswarm/seaswarm.db
      DATA_DIR: /data
      ROOM_TEMPLATE: /app/room_templates/sar_room.yaml
    volumes:
      - ./.runtime:/var/lib/seaswarm
      - ./data:/data:ro
      - ./room_templates:/app/room_templates:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      switch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  action-agent:
    build: .
    command: ["uvicorn", "agents.action_agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      ROOM_ID: sar-harnai
      AGENT_NAME: action
      DATABASE_URL: sqlite:////var/lib/seaswarm/seaswarm.db
      DATA_DIR: /data
      ROOM_TEMPLATE: /app/room_templates/sar_room.yaml
      EXPORT_DIR: /var/lib/seaswarm/exports
      FOLLOWUP_INTERVAL_SECONDS: "1800"
    volumes:
      - ./.runtime:/var/lib/seaswarm
      - ./data:/data:ro
      - ./room_templates:/app/room_templates:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      switch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo:
    profiles: ["demo"]
    build: .
    command: ["python", "scripts/replay_demo.py"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      ROOM_ID: sar-harnai
      DATABASE_URL: sqlite:////var/lib/seaswarm/seaswarm.db
      DATA_DIR: /data
      ROOM_TEMPLATE: /app/room_templates/sar_room.yaml
      EXPORT_DIR: /var/lib/seaswarm/exports
      PERSISTENCE: "on"
      SEASWARM_SEED: "42"
      LLM_API_KEY: ""
    volumes:
      - ./.runtime:/var/lib/seaswarm
      - ./data:/data:ro
      - ./room_templates:/app/room_templates:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      context-agent:
        condition: service_healthy
      options-agent:
        condition: service_healthy
      action-agent:
        condition: service_healthy
    restart: "no"

  adapters:
    profiles: ["adapters"]
    build: .
    command: ["uvicorn", "adapters.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
    ports:
      - "8091:8000"
    depends_on:
      switch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  echo-agent:
    profiles: ["echo"]
    build: .
    command: ["uvicorn", "agents.echo_agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SWITCH_URL: http://switch:8090
      ROOM_ID: sar-harnai
      AGENT_NAME: echo
    depends_on:
      switch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  mm_data:
  mm_config:
  mm_logs:
  mm_plugins:
  mm_client_plugins:
